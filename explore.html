 <section id="explore" class="page">
      <div class="page-heading">
        <span class="section-kicker">EXPLORE</span>
        <h1>Find what you need.</h1>
        <p>Search local businesses and filter offers by category.</p>
      </div>

      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search shops, offers, places..." autocomplete="off">
      </label>

      <div class="chips" id="categoryChips">
        <button class="chip active" data-category="All">All</button>
        <button class="chip" data-category="Supermarket">Supermarket</button>
        <button class="chip" data-category="Textiles">Textiles</button>
        <button class="chip" data-category="Dining">Dining</button>
        <button class="chip" data-category="Services">Services</button>
      </div>

      <div class="explore-list" id="exploreList"></div>
    </section>
