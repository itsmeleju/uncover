<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncover · Sign In</title>
  <link rel="icon" type="image/x-icon" href="static/logo.svg">
  <meta name="theme-color" content="#062e1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/authy.css">
</head>
<body>

  <!-- Top Floating App Bar -->
  <header class="topbar">
    <a class="brand" href="/" aria-label="Uncover Home">
      <span class="brand-dot"></span>
      <span><span style="color: var(--kerala-green);">Un</span>cover</span>
    </a>
    <span class="location-pill">Kerala · Local</span>
  </header>

  <!-- Auth Card Component -->
  <main class="auth-wrapper">
    <div class="auth-hero-card">
      
      <div class="auth-headline">
        <span class="auth-badge">Local · Direct · Verified</span>
        <h2 id="authTitle">Welcome to Uncover</h2>
        <p id="authSubtitle">Discover shop flyers and deals in your locality</p>
      </div>

      <div class="switch-group">
        <!-- 1. Form Mode Switcher (Login vs Sign Up) -->
        <div class="segmented-control">
          <input type="radio" id="tab-login-btn" name="auth-mode" value="login" checked onchange="switchAuthView('login')">
          <label for="tab-login-btn">Log In</label>
          
          <input type="radio" id="tab-signup-btn" name="auth-mode" value="signup" onchange="switchAuthView('signup')">
          <label for="tab-signup-btn">Create Account</label>
          
          <div class="slide-glider glider-auth"></div>
        </div>

        <!-- 2. Role Selector Switcher (User vs Shop Owner) -->
        <div class="segmented-control">
          <input type="radio" id="role-user" name="role" value="user" checked onchange="handleRoleSwitch('user')">
          <label for="role-user">👤 User Account</label>
          
          <input type="radio" id="role-shop" name="role" value="shop" onchange="handleRoleSwitch('shop')">
          <label for="role-shop">🏪 Shop Owner</label>
          
          <div class="slide-glider glider-role"></div>
        </div>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form active-form" method="POST" action="">
        <!-- Cross-Site Request Forgery (CSRF) attacks -for_security- {% csrf_token %} -->
        <input type="hidden" name="action_type" value="login">
        <input type="hidden" id="loginRoleInput" name="role" value="user">

        <input type="email" class="input-field" name="email" placeholder="Phone or Email Address" required>
        <input type="password" class="input-field" name="password" placeholder="Password" required>
        
        <button type="submit" class="btn-submit">
          <span>Continue</span> →
        </button>
        <a href="#" class="form-footer-link">Forgot password?</a>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" class="auth-form" method="POST" action="">
        <!-- Cross-Site Request Forgery (CSRF) attacks -for_security-  {% csrf_token %} -->
        <input type="hidden" name="action_type" value="signup">
        <input type="hidden" id="signupRoleInput" name="role" value="user">

        <input type="text" id="nameField" class="input-field" name="fullname" placeholder="Full Name" required>
        <input type="email" class="input-field" name="email" placeholder="Email Address" required>
        <input type="tel" class="input-field" name="phone" placeholder="Phone Number (10 digits)" pattern="[0-9]{10}" required>
        <input type="password" class="input-field" name="password" placeholder="Create Password" required>

        <button type="submit" class="btn-submit">
          <span>Create Account</span> →
        </button>
      </form>

    </div>
  </main>

  <!-- View Controller Script -->
  <script>
    function switchAuthView(mode) {
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');

      if (mode === 'login') {
        loginForm.classList.add('active-form');
        signupForm.classList.remove('active-form');
        title.innerText = "Welcome to Uncover";
        subtitle.innerText = "Discover shop flyers and deals in your locality";
      } else {
        signupForm.classList.add('active-form');
        loginForm.classList.remove('active-form');
        title.innerText = "Join Uncover";
        subtitle.innerText = "Get started with your local community hub";
      }
    }

    function handleRoleSwitch(role) {
      document.getElementById('loginRoleInput').value = role;
      document.getElementById('signupRoleInput').value = role;
      
      const nameInput = document.getElementById('nameField');
      if (role === 'shop') {
        nameInput.placeholder = "Shop / Business Name";
      } else {
        nameInput.placeholder = "Full Name";
      }
    }
  </script>

</body>
</html>
